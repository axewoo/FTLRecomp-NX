name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  switch:
    name: Nintendo Switch (ftl.nro)
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build git curl ca-certificates
          dkp-pacman -Syu --noconfirm --needed \
            switch-dev switch-cmake switch-pkg-config switch-mesa switch-libdrm_nouveau

      - name: Cache SDL3 for Switch
        uses: actions/cache@v6
        with:
          path: build/sdl3-nx-prefix
          key: sdl3-nx-${{ hashFiles('scripts/build-switch.sh') }}

      - name: Build
        run: bash scripts/build-switch.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ftl-switch
          path: build/ftl.nro

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/ftl.nro
          generate_release_notes: true

  linux:
    name: Linux (PC test build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libwayland-dev \
            libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev
      - name: Build
        run: bash scripts/build-linux.sh
